<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Schattenlabor – Physik 7</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#182c43;background:#edf3f8}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:1000px;margin:auto}.panel{background:white;border-radius:18px;padding:clamp(16px,3vw,28px);box-shadow:0 8px 28px #1b38531a}h1{margin:0 0 8px;font-size:clamp(24px,4vw,34px)}p{line-height:1.5;color:#43556a}.tag{font-size:13px;font-weight:700;letter-spacing:.07em;color:#246a8e;text-transform:uppercase}svg{display:block;width:100%;height:auto;background:#f8fbfe;border:1px solid #dce6ef;border-radius:14px;touch-action:none}input[type=range]{width:100%;accent-color:#197baf;min-height:44px}.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px}.controls label{font-weight:650;flex:1 1 290px}button{font:inherit;border:1px solid #c6d8e6;background:#f4f9fc;color:#1c4c6c;border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:650}button:focus-visible,input:focus-visible{outline:3px solid #ffbb4e;outline-offset:3px}.note{font-size:14px;color:#546679}.key{display:flex;flex-wrap:wrap;gap:18px;font-size:14px;margin:16px 0}.key span:before{content:'';display:inline-block;width:20px;height:4px;vertical-align:middle;margin-right:7px;background:var(--c)}.task{margin-top:18px;border-left:4px solid #2588b7;padding:10px 16px;background:#f0f7fb;border-radius:0 10px 10px 0}.task p{margin:6px 0}.footer{font-size:13px;margin-top:14px} @media(max-width:600px){body{padding:10px}.panel{border-radius:12px}.controls{gap:5px}button{width:100%}}

/* iPad-Optimierung: Querformat, ohne die Physik-Berechnung zu verändern */
@media (orientation: landscape) and (min-width: 700px) and (max-height: 1100px) {
  body { padding: 10px 14px; }
  main { max-width: 1500px; }
  .panel { padding: 12px 18px; border-radius: 14px; }

  input[type=range] { min-height: 44px; }

</style></head><body><main><section class="panel"><div class="tag">Physik · Klasse 7 · Licht und Schatten</div><h1>Das Schattenlabor</h1><p>Verschiebe das Hindernis (Maus) zwischen Lichtquelle und Schirm. Beobachte dabei die Randstrahlen und das Schattenbild.</p>
<svg id="scene" viewBox="0 0 900 390" role="img" aria-label="Strahlengang mit einer punktförmigen Lichtquelle links, verschiebbarer Maus und Schirm rechts"><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#a6b4c2" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="900" height="390" fill="#f8fbfe"/><rect x="0" y="0" width="807" height="390" fill="#fff5ce"/><polygon id="shadowSpace" fill="#737b85" opacity="1" points=""/><g id="rays" stroke="#e69a21" stroke-width="3" stroke-linecap="round"><line id="upper"/><line id="lower"/></g><rect x="807" y="0" width="9" height="390" fill="#6d8196"/><line id="shadow" x1="811" x2="811" stroke="#314e70" stroke-width="12" stroke-linecap="round"/><circle cx="90" cy="195" r="11" fill="#f5ba49" stroke="#bd7a14" stroke-width="3"/><g stroke="#e4a330" stroke-width="3"><path d="M90 169v-12M90 221v12M64 195H52M116 195h12M72 177l-9 -9M108 213l9 9M108 177l9 -9M72 213l-9 9"/></g><g id="mouse" fill="#3787ae" stroke="#195578" stroke-width="2"><rect id="obstacle" x="0" y="171" width="12" height="48" rx="4"/></g><g id="inlineLabels" font-family="system-ui,sans-serif" font-size="18" font-weight="650" pointer-events="none" style="paint-order:stroke;stroke:#fff5ce;stroke-width:5px;stroke-linejoin:round">
<text id="rayLabel" fill="#a76608" text-anchor="middle">Randstrahl</text>
<text id="spaceLabel" fill="#385d7d" text-anchor="middle">Schattenraum</text>
<path d="M 760 273 L 801 219" fill="none" stroke="#314e70" stroke-width="2" style="stroke:#314e70"/>
<text x="749" y="284" fill="#314e70" text-anchor="end">Schattenbild</text>
</g><g fill="#283d52" font-size="19" font-family="system-ui,sans-serif"><text x="120" y="143" text-anchor="start" font-weight="650">Lichtquelle</text><text id="mouseLabel" y="259" text-anchor="middle" font-size="17"><tspan id="mouseLabelLine1">Hindernis</tspan><tspan id="mouseLabelLine2" x="0" dy="21">(Maus)</tspan></text><text x="844" y="376" text-anchor="start">Schirm</text></g></svg>

<div class="controls"><label for="position">Abstand zwischen Lichtquelle und Hindernis <input id="position" type="range" min="15" max="92" value="48" step="1"></label><button id="reset" type="button">Ausgangsposition</button></div>
</section></main>
<script>
(()=>{'use strict';const slider=document.getElementById('position'),mouse=document.getElementById('mouse'),obstacle=document.getElementById('obstacle'),mouseLabelLine2=document.getElementById('mouseLabelLine2'),upper=document.getElementById('upper'),lower=document.getElementById('lower'),shadow=document.getElementById('shadow'),space=document.getElementById('shadowSpace'),label=document.getElementById('mouseLabel'),scene=document.getElementById('scene'),rayLabel=document.getElementById('rayLabel'),spaceLabel=document.getElementById('spaceLabel');const sx=90,sy=195,screen=811,top=171,bottom=219;/* Bei 15 % Abstand liegt die Schattengrenze innerhalb des 390px hohen Schirms. */function draw(){const p=Number(slider.value)/100,x=sx+p*(screen-sx),factor=(screen-sx)/(x-sx),yt=sy+(top-sy)*factor,yb=sy+(bottom-sy)*factor;obstacle.setAttribute('x',x-6);label.setAttribute('x',x);mouseLabelLine2.setAttribute('x',x);upper.setAttribute('x1',sx);upper.setAttribute('y1',sy);upper.setAttribute('x2',screen);upper.setAttribute('y2',yt);lower.setAttribute('x1',sx);lower.setAttribute('y1',sy);lower.setAttribute('x2',screen);lower.setAttribute('y2',yb);shadow.setAttribute('y1',yt);shadow.setAttribute('y2',yb);space.setAttribute('points',`${x},${top} ${screen},${yt} ${screen},${yb} ${x},${bottom}`);const rx=500;rayLabel.setAttribute('x',rx);rayLabel.setAttribute('y',Math.max(28,sy+(top-sy)*(rx-sx)/(x-sx)-17));spaceLabel.setAttribute('x',Math.min(770,(x+screen)/2));spaceLabel.setAttribute('y',195)}slider.addEventListener('input',draw);document.getElementById('reset').addEventListener('click',()=>{slider.value=48;draw()});let dragging=false;function updateFromPointer(e){const pt=scene.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const matrix=scene.getScreenCTM();if(!matrix)return;const q=pt.matrixTransform(matrix.inverse());slider.value=Math.max(15,Math.min(92,Math.round((q.x-sx)/(screen-sx)*100)));draw()}scene.addEventListener('pointerdown',e=>{const rect=scene.getBoundingClientRect();if(!rect)return;dragging=true;scene.setPointerCapture(e.pointerId);updateFromPointer(e)});scene.addEventListener('pointermove',e=>{if(dragging)updateFromPointer(e)});scene.addEventListener('pointerup',()=>dragging=false);scene.addEventListener('pointercancel',()=>dragging=false);draw()})();
</script></body></html>
